<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WOLFA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800;900&family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600;700&family=Share+Tech+Mono&family=Sora:wght@300;400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style>
/* Layout: palco pop em formato "adesivo": bordas grossas, sombras duras, trilho lateral no desktop e barra inferior no celular. */
:root{
  --bg:#FFF1F8; --dot:#FFD3EA; --card:#FFFFFF; --soft:#FFE4F3;
  --ink:#2A1240; --mute:#7A5C8F; --line:#F3C8E6;
  --bd:#2A1240; --sh:#2A1240;
  --pri:#FF2E93; --pri-ink:#FFFFFF; --acc:#7B2FFF; --acc-ink:#FFFFFF; --acc2:#00B3A4;
  --sun:#FFD60A; --sun-ink:#2A1240; --good:#12A150; --bad:#E5383B; --warn:#F59E0B;
  --f-d:'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html[data-w="noite"]{--bg:#140A26;--dot:#24133F;--card:#22123D;--soft:#32195A;--ink:#F8EEFF;--mute:#BBA4DA;--line:#3E2766;--bd:#7A52C7;--sh:#06020F;--pri:#FF4FB0;--pri-ink:#1A0620;--acc:#9B6BFF;--acc-ink:#12061F;--acc2:#2EF2D0;--sun:#FFE14D;--sun-ink:#1A0620;--good:#3DDC84;--bad:#FF6B6B;--warn:#FFB84D;color-scheme:dark}
html[data-w="oceano"]{--bg:#E4F7FF;--dot:#BFE8F7;--card:#FFFFFF;--soft:#D3F1FC;--ink:#062B44;--mute:#4A7390;--line:#ADDFF2;--bd:#062B44;--sh:#062B44;--pri:#0A84FF;--pri-ink:#FFFFFF;--acc:#00A896;--acc-ink:#FFFFFF;--acc2:#FF7A59;--sun:#FFD166;--sun-ink:#062B44;--good:#0E9F6E;--bad:#E5383B;--warn:#E8890C}
html[data-w="por"]{--bg:#FFEAD6;--dot:#FFD2AE;--card:#FFF9F2;--soft:#FFE0C4;--ink:#3A1620;--mute:#8A5560;--line:#F5C39B;--bd:#3A1620;--sh:#3A1620;--pri:#FF5A36;--pri-ink:#FFFFFF;--acc:#C21E56;--acc-ink:#FFFFFF;--acc2:#F5A100;--sun:#FFC933;--sun-ink:#3A1620;--good:#2E9E4F;--bad:#D62839;--warn:#E8890C}
html[data-w="floresta"]{--bg:#E8F7E4;--dot:#C6E9C0;--card:#FFFFFF;--soft:#D4F0CE;--ink:#10331D;--mute:#4D7858;--line:#B8DFB3;--bd:#10331D;--sh:#10331D;--pri:#1FA84F;--pri-ink:#FFFFFF;--acc:#F57C00;--acc-ink:#FFFFFF;--acc2:#6C4DF5;--sun:#FFD84D;--sun-ink:#10331D;--good:#1B8A44;--bad:#D62839;--warn:#E8890C}
html[data-w="galaxia"]{--bg:#0B0F2B;--dot:#161C45;--card:#161B44;--soft:#222A62;--ink:#EEF0FF;--mute:#A5ACDD;--line:#2E3774;--bd:#5C6BE0;--sh:#03050F;--pri:#7C5CFF;--pri-ink:#FFFFFF;--acc:#FF5CA8;--acc-ink:#1A0620;--acc2:#3DE0FF;--sun:#FFD84D;--sun-ink:#10143A;--good:#3DDC84;--bad:#FF6B7A;--warn:#FFB84D;color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.9px);background-size:22px 22px;color:var(--ink);font:500 15px/1.45 var(--f-b);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--bd);border-radius:14px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);font-weight:400;margin:0;letter-spacing:.2px;text-wrap:balance}
h2{font-size:22px}h3{font-size:18px}
p{margin:0}
small,.mute{color:var(--mute)}
.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-bottom:150px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1120px;margin:0 auto}
.logo{font-family:var(--f-d);font-size:30px;line-height:1;color:var(--pri);text-shadow:2px 2px 0 var(--sh);display:flex;align-items:center;gap:6px;margin-right:auto}
.logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
.pill{display:inline-flex;align-items:center;gap:5px;border:3px solid var(--bd);border-radius:999px;background:var(--card);padding:3px 11px;font-weight:800;font-size:13px;white-space:nowrap}
.pill.btnlike{cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:4px;background:var(--card);border-top:3px solid var(--bd);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav button{flex:1;min-width:0;border:3px solid transparent;border-radius:16px;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:10.5px}
.nav button b{font-size:20px;line-height:1.1}
.nav button.on{background:var(--sun);color:var(--sun-ink);border-color:var(--bd);box-shadow:3px 3px 0 var(--sh)}
.card{background:var(--card);border:3px solid var(--bd);border-radius:22px;box-shadow:5px 5px 0 var(--sh);padding:16px;min-width:0}
.card.flat{box-shadow:none}
.stack{display:grid;gap:14px;min-width:0}
.cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{border:3px solid var(--bd);border-radius:16px;background:var(--card);padding:9px 16px;font-weight:900;box-shadow:3px 3px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:12px;box-shadow:2px 2px 0 var(--sh)}
.btn.ghost{box-shadow:none;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{border:3px solid var(--bd);border-radius:999px;background:var(--card);padding:5px 12px;font-weight:800;font-size:13.5px}
.chip.on{background:var(--acc);color:var(--acc-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;z-index:26;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:3px solid var(--bd);background:var(--pri);color:var(--pri-ink);font:400 34px/1 var(--f-d);box-shadow:4px 4px 0 var(--sh);display:grid;place-items:center;padding:0}
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--soft),var(--card))}
.wolf{font-size:64px;line-height:1;animation:bob 2.2s ease-in-out infinite;flex:none;filter:drop-shadow(3px 3px 0 var(--sh))}
.bubble{position:relative;background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:10px 14px;min-width:0}
.bubble small{font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--pri);font-size:11px}
.bubble p{font-weight:800;margin-top:2px}
.thermo{position:relative;width:46px;height:176px;flex:none;border:3px solid var(--bd);border-radius:24px 24px 30px 30px;background:var(--soft)}
.thermo .tube{position:absolute;left:9px;right:9px;top:9px;bottom:28px;background:var(--card);border-radius:12px;overflow:hidden;border:2px solid var(--bd)}
.thermo .fill{position:absolute;left:0;right:0;bottom:0;height:var(--t,50%);background:linear-gradient(0deg,var(--tc,#FF2E93),var(--tc2,#FFD60A));transition:height .9s cubic-bezier(.3,1.5,.5,1)}
.thermo .bulb{position:absolute;left:50%;bottom:-8px;width:40px;height:40px;margin-left:-20px;border-radius:50%;border:3px solid var(--bd);background:var(--tc,#FF2E93)}
.thermo.sm{height:120px;width:36px}
.moods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mood{border:3px solid var(--bd);border-radius:18px;background:var(--card);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px;box-shadow:3px 3px 0 var(--sh)}
.mood b{font-size:30px;line-height:1.1}
.mood.on{background:var(--mc);color:#1A0A2A;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.task{display:flex;gap:10px;align-items:flex-start;border:3px solid var(--bd);border-left:12px solid var(--cc,var(--pri));border-radius:16px;padding:10px;background:var(--card);min-width:0}
.task .tbody{flex:1;min-width:0}
.task .tbody>b{display:block;overflow-wrap:anywhere}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-size:12.5px;font-weight:800;color:var(--mute)}
.task .tn{margin-top:4px;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.task .tact{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:112px}
.task .tact button{border:2px solid var(--bd);background:var(--soft);border-radius:10px;width:32px;height:32px;padding:0;font-size:15px}
.chk{width:38px;height:38px;flex:none;border-radius:12px;border:3px solid var(--bd);background:var(--card);font:400 22px/1 var(--f-d);padding:0;color:transparent;box-shadow:2px 2px 0 var(--sh)}
.task.st-d{opacity:.78}.task.st-d .chk{background:var(--good);color:#fff}.task.st-d .tbody>b{text-decoration:line-through}
.task.st-m .chk{background:var(--bad);color:#fff}.task.st-p .chk{background:var(--warn);color:#fff}
.tag{display:inline-block;border-radius:8px;padding:0 7px;font-size:11.5px;font-weight:900;border:2px solid var(--bd);background:var(--soft);color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{text-align:center;font-size:11px;font-weight:900;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.cell{min-height:58px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:3px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-width:0}
.cell.out{visibility:hidden}
.cell .n{font-weight:900;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.cell .dots{display:flex;gap:3px;flex-wrap:wrap}
.cell .dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--bd)}
.cell.today{border-color:var(--pri);border-width:3px}
.cell.sel{background:var(--sun);color:var(--sun-ink);border-color:var(--bd)}
.cell.heat{min-height:50px;align-items:center;justify-content:center;gap:0}
.hbar{position:relative;height:22px;border:3px solid var(--bd);border-radius:12px;background:var(--soft);overflow:hidden}
.hbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--cc);opacity:.85;border-left:1.5px solid var(--bd);min-width:4px}
.hticks{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--mute);margin-top:2px}
.bar{height:16px;border:2px solid var(--bd);border-radius:10px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bc,var(--pri));border-right:2px solid var(--bd)}
.brow{display:grid;grid-template-columns:96px minmax(0,1fr) 46px;gap:8px;align-items:center;font-weight:800;font-size:13px}
.brow span:last-child{text-align:right}
.ring{width:112px;height:112px;border-radius:50%;border:3px solid var(--bd);background:conic-gradient(var(--good) var(--p,0deg),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring div{width:76px;height:76px;border-radius:50%;background:var(--card);border:3px solid var(--bd);display:grid;place-items:center;font:400 24px var(--f-d)}
.verdict{border:3px solid var(--bd);border-radius:18px;padding:14px;background:var(--vc,var(--soft));color:#1A0A2A}
.verdict h3{font-size:22px}
.xpbar{height:20px;border:3px solid var(--bd);border-radius:12px;background:var(--soft);overflow:hidden}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pri) 0 10px,var(--acc) 10px 20px)}
.mission{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;border:3px solid var(--bd);border-radius:16px;padding:9px;background:var(--card)}
.mission.ok{background:var(--soft)}
.mission .mi{font-size:24px;text-align:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.badge{border:3px solid var(--bd);border-radius:16px;padding:10px 6px;text-align:center;font-size:12px;font-weight:800;background:var(--card)}
.badge b{display:block;font-size:30px}
.badge.lock{filter:grayscale(1);opacity:.5}
.q{border:3px solid var(--bd);border-radius:18px;padding:12px;background:var(--card);display:grid;gap:8px}
.q label{font-weight:900;display:block}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid var(--bd);padding:0}
.sw button.on{outline:4px solid var(--pri);outline-offset:2px}
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(20,6,40,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border:3px solid var(--bd);border-radius:26px 26px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.gate{position:fixed;inset:0;z-index:70;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.9px);background-size:22px 22px;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gate .in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:10px;border:2px solid var(--bd);border-radius:6px;background:var(--card)}.steps i.on{background:var(--pri)}
.swipe-stage{position:relative;height:min(400px,52vh);width:100%;max-width:360px;margin:0 auto}
.scard{position:absolute;inset:0;border:3px solid var(--bd);border-radius:26px;background:var(--card);box-shadow:6px 6px 0 var(--sh);padding:20px;display:flex;flex-direction:column;justify-content:space-between;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.scard.back{transform:scale(.94) translateY(14px);background:var(--soft);pointer-events:none}
.scard .big{font-size:60px;line-height:1}
.scard h2{font-size:26px;overflow-wrap:anywhere}
.stamp{position:absolute;top:16px;border:4px solid;border-radius:12px;padding:0 12px;font:400 28px/1.3 var(--f-d);opacity:0;pointer-events:none}
.stamp.yes{left:14px;color:var(--good);transform:rotate(-12deg)}
.stamp.no{right:14px;color:var(--bad);transform:rotate(12deg)}
#toasts{position:fixed;z-index:90;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:grid;gap:8px;justify-items:center;padding:0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;max-width:460px;background:var(--card);border:3px solid var(--bd);border-radius:18px;box-shadow:4px 4px 0 var(--sh);padding:9px 14px;font-weight:800;animation:up .25s ease}
.toast .te{font-size:26px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(5px,-2px)}}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tcard{border:3px solid var(--bd);border-radius:16px;background:var(--card);padding:8px;font-weight:800;text-align:left;display:grid;gap:6px}
.tcard.on{outline:4px solid var(--pri);outline-offset:2px}
.tcard span{display:flex;height:18px;border:2px solid var(--bd);border-radius:9px;overflow:hidden}.tcard span i{flex:1}
.lbl{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:4px;display:block}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sum{width:100%;min-height:210px;line-height:1.5}
.tabular{font-variant-numeric:tabular-nums}
.banner{background:var(--sun);color:var(--sun-ink);border:3px solid var(--bd);border-radius:16px;padding:10px 14px;font-weight:800}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:120px}
.wk div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11px;font-weight:900}
.wk div i{width:100%;border:2px solid var(--bd);border-radius:8px 8px 3px 3px;background:var(--good);min-height:4px}
.spark{width:100%;height:auto;display:block}
@media(min-width:700px){.cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.moods{grid-template-columns:repeat(5,minmax(0,1fr))}.cell{min-height:74px}.sheetbg{align-items:center}.sheet{border-radius:26px;max-height:88%}}
@media(min-width:900px){
  .shell{grid-template-columns:190px minmax(0,1fr);padding-bottom:60px;align-items:start}
  .nav{position:sticky;top:calc(74px + env(safe-area-inset-top,0px));left:auto;right:auto;bottom:auto;flex-direction:column;border:3px solid var(--bd);border-radius:22px;box-shadow:5px 5px 0 var(--sh);padding:10px}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:8px 10px}
  .fab{bottom:28px}
  .cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:420px){.brow{grid-template-columns:76px minmax(0,1fr) 40px}.hero{flex-direction:column;text-align:center}.task .tact{max-width:76px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Temas celestiais ===== */

/* ===== Central em vidro (layout do site) ===== */
.metal{background:linear-gradient(135deg,#f6f8fb,#9ba7b8 48%,#dde4ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.h-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center;padding:clamp(16px,4vw,48px) 0}
.h-hero h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:300;line-height:1.06;letter-spacing:-.03em}

.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.core{position:relative;aspect-ratio:1;width:min(100%,380px);margin-inline:auto}
.core>i{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line)}
.core>i:nth-child(2){inset:11%;border-color:var(--bd)}.core>i:nth-child(3){inset:24%}
.core .arc{position:absolute;inset:11%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 62%,rgba(120,175,235,.9) 80%,transparent 82%);-webkit-mask:radial-gradient(circle,transparent calc(50% - 2px),#000 calc(50% - 1px),#000 50%,transparent calc(50% + 1px));mask:radial-gradient(circle,transparent calc(50% - 2px),#000 calc(50% - 1px),#000 50%,transparent calc(50% + 1px));animation:spin 14s linear infinite}
.core .glow{position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle,rgba(74,134,201,.5),rgba(27,75,138,.15) 55%,transparent 72%);filter:blur(6px);animation:breathe 6s ease-in-out infinite}
.core .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.core .pct b{font:300 clamp(2rem,6vw,2.75rem) var(--f-d);letter-spacing:-.03em}.core .pct small{color:var(--mute)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{50%{opacity:.55;transform:scale(.94)}}
.rd{position:absolute;padding:10px 14px;border-radius:14px;font-size:12.5px;line-height:1.3;color:var(--mute);background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 18px 40px -26px #000,inset 0 1px 0 rgba(255,255,255,.08)}

.rule{width:36px;height:2px;border-radius:2px;background:linear-gradient(135deg,#f6f8fb,#9ba7b8 48%,#dde4ee);margin-bottom:16px}
.lift{transition:transform .5s var(--ease,cubic-bezier(.22,.8,.3,1)),border-color .5s;overflow:hidden}
.lift:hover{transform:translateY(-4px)}
html[data-l=cel] .card.lift::before{display:block;content:"";position:absolute;inset:0;width:auto;height:auto;border:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px 220px at 20% 0%,rgba(120,170,230,.18),transparent 70%);opacity:0;transition:opacity .5s}

.t1{--s:radial-gradient(500px 300px at 78% 20%,rgba(74,134,201,.7),transparent 70%),linear-gradient(135deg,#0d2342,#070b13)}

function occursOn(t,d){
  if(d<t.start||(t.end&&d>t.end)||(t.skip&&t.skip.indexOf(d)>=0))return false;
  const dt=parse(d),st=parse(t.start);
  if(t.rep==='none')return t.end?true:d===t.start;
  if(t.rep==='daily')return true;
  if(t.rep==='weekly')return dt.getDay()===st.getDay();
  if(t.rep==='monthly')return dt.getDate()===Math.min(st.getDate(),daysIn(dt.getFullYear(),dt.getMonth()));
  if(t.rep==='custom')return t.days.indexOf(dt.getDay())>=0;
  return false;
}

/* ---------- Google Agenda ---------- */
function rrule(t){
  const D2=['SU','MO','TU','WE','TH','FR','SA'];let r='';
  if(t.rep==='daily'||(t.rep==='none'&&t.end))r='FREQ=DAILY';else if(t.rep==='weekly')r='FREQ=WEEKLY';else if(t.rep==='monthly')r='FREQ=MONTHLY';else if(t.rep==='custom')r='FREQ=WEEKLY;BYDAY='+t.days.map(i=>D2[i]).join(',');
  if(r&&t.end)r+=';UNTIL='+t.end.replace(/-/g,'')+(t.time?'T235959':'');
  return r;
}
function firstOcc(t){let d=t.start;for(let i=0;i<400;i++){if(occursOn(t,d))return d;d=addDays(d,1)}return t.start}
const cmp=d=>d.replace(/-/g,'');
function dtParts(t,d){
  if(!t.time)return{s:cmp(d),e:cmp(addDays(d,1)),allday:true};
  const x=parse(d),s=tmin(t.time),e=new Date(x.getFullYear(),x.getMonth(),x.getDate(),0,s+(t.dur||30));
  return{s:cmp(d)+'T'+pad(Math.floor(s/60))+pad(s%60)+'00',e:cmp(ymd(e))+'T'+pad(e.getHours())+pad(e.getMinutes())+'00'};
}
function gcalUrl(t){
  const d=firstOcc(t),p=dtParts(t,d),r=rrule(t),c=CATS[t.cat]||CATS.outro;
  let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(c.e+' '+t.title)+'&dates='+p.s+'/'+p.e+'&details='+encodeURIComponent((t.note||'')+(t.note?'\n\n':'')+'Criado na WOLFA');
  if(r)u+='&recur='+encodeURIComponent('RRULE:'+r);
  return u;
}
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function icsAll(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//WOLFA//PT-BR//','CALSCALE:GREGORIAN'];
  S.tasks.forEach(t=>{const d=firstOcc(t),p=dtParts(t,d),r=rrule(t),c=CATS[t.cat]||CATS.outro;
    L.push('BEGIN:VEVENT','UID:'+t.id+'@wolfa','DTSTAMP:'+cmp(today())+'T000000');
    if(p.allday)L.push('DTSTART;VALUE=DATE:'+p.s,'DTEND;VALUE=DATE:'+p.e);else L.push('DTSTART:'+p.s,'DTEND:'+p.e);
    L.push('SUMMARY:'+icsEsc(c.e+' '+t.title));if(t.note)L.push('DESCRIPTION:'+icsEsc(t.note));
    if(r)L.push('RRULE:'+r);
    (t.skip||[]).forEach(x=>L.push(p.allday?'EXDATE;VALUE=DATE:'+cmp(x):'EXDATE:'+cmp(x)+p.s.slice(8)));
    if(t.lead>=0&&t.time)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(t.title),'TRIGGER:-PT'+t.lead+'M','END:VALARM');
    L.push('END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n');
}

function bindSwipe(el){
  let sx=0,sy=0,dx=0,on=false;
  el.addEventListener('pointerdown',e=>{on=true;sx=e.clientX;sy=e.clientY;try{el.setPointerCapture(e.pointerId)}catch(x){}el.style.transition='none'});
  el.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;const dy=(e.clientY-sy)*.3;el.style.transform='translate('+dx+'px,'+dy+'px) rotate('+dx/18+'deg)';const p=Math.min(1,Math.abs(dx)/110);$('.stamp.yes',el).style.opacity=dx>0?p:0;$('.stamp.no',el).style.opacity=dx<0?p:0});
  const end=()=>{if(!on)return;on=false;if(Math.abs(dx)>100)flyOut(dx>0?'yes':'no');else{el.style.transition='transform .25s ease';el.style.transform='';$$('.stamp',el).forEach(s=>s.style.opacity=0)}dx=0};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function flyOut(dir){const el=$('#scard');if(!el){swipeDecide(dir);return}const s=dir==='yes'?1:-1;el.style.transition='transform .3s ease';el.style.transform='translate('+s*innerWidth+'px,0) rotate('+s*25+'deg)';setTimeout(()=>swipeDecide(dir),240)}
function swipeDecide(dir){
  const c=G.q[G.idx];if(!c)return;
  if(dir==='yes'){setStatus(c.t,c.d,'d');celebrate(say('done'));G.idx++;renderTop();drawGate()}
  else{G.sub='why';G.reason=null;drawGate()}
}

  const c=G.q[G.idx];if(!G.reason){toast('Escolha um motivo, é rapidinho.',{e:'💬'});return}
  const n=($('#gwhy')||{value:''}).value.trim();
  if(post){setStatus(c.t,c.d,'p',{r:G.reason,n:n});S.tasks.push(Object.assign(clone(c.t),{id:uid(),start:addDays(today(),1),end:'',rep:'none',days:[],skip:[],demo:false,title:c.t.title}));save()}
  else setStatus(c.t,c.d,'m',{r:G.reason,n:n});
  toast(say('miss'),{e:REASONS[G.reason].e});G.idx++;G.sub='';renderTop();drawGate();
}
function finishGate(){
  S.lastGate=today();S.tone=G.tone;save();$('#gate').hidden=true;document.body.style.overflow='';
  render();celebrate('Bora, '+(S.name||'você')+'! Agenda liberada.',pick(['confete','fogos','lobos']));
}

/* ---------- lembretes inteligentes ---------- */
const FIRED=new Set();let curDay=today();
function smartLead(t){
  if(t.lead<0)return null;let extra=0;
  const r=range(addDays(today(),-14),14),c=r.cat[t.cat];
  if(c&&c.n>=4&&c.d/c.n<.5)extra=15;
  return{lead:t.lead+extra,smart:extra>0};
}
function tick(){
  const d=today();
  if(d!==curDay){curDay=d;if(S.lastGate!==d)showGate();render()}
  if(!S.prefs.rem)return;
  const nm=nowMin();
  occurrences(d).forEach(t=>{
    if(!t.time||S.log[lk(t.id,d)])return;const sl=smartLead(t);if(!sl)return;
    const st=tmin(t.time),k=t.id+d;
    if(nm>=st-sl.lead&&nm<st+5&&!FIRED.has(k)){FIRED.add(k);const m=st-nm,when=m>0?'em '+m+' min':'agora';beep();
      toast(say('rem',{t:t.title,m:when,h:t.time})+(sl.smart?' (Avisei antes porque essa categoria anda escapando.)':''),{e:(CATS[t.cat]||CATS.outro).e,ms:9000,act:{t:'Feito',fn:()=>{setStatus(t,d,'d');celebrate(say('done'));render()}}})}
  });
}

/* ---------- ações ---------- */
const ACT={
nav:b=>go(b.dataset.v),
settings:()=>settings(),
closesheet:()=>closeSheet(),
cleardemo:()=>{S.tasks=S.tasks.filter(t=>!t.demo);save();render();toast('Exemplos removidos.',{e:'🧹'})},
addtask:()=>openTaskForm(null,V==='agenda'?cal.sel:today()),
edit:b=>openTaskForm(b.dataset.id,b.dataset.d),
gcal:b=>{const t=S.tasks.find(x=>x.id===b.dataset.id);if(t)window.open(gcalUrl(t),'_blank')},
toggle:b=>{
  const t=S.tasks.find(x=>x.id===b.dataset.id),d=b.dataset.d;if(!t)return;
  if(stOf(t,d)==='d'){setStatus(t,d,null);render();return}
  setStatus(t,d,'d');
  const ds=dayStats(d);
  if(d===today()&&ds.tot>0&&ds.done===ds.tot)celebrate(say('all'),pick(['fogos','confete','lobos']));else celebrate(say('done'));
  render();
},
postpone:b=>{const t=S.tasks.find(x=>x.id===b.dataset.id),d=b.dataset.d;if(!t)return;setStatus(t,d,'p');S.tasks.push(Object.assign(clone(t),{id:uid(),start:addDays(d,1),end:'',rep:'none',days:[],skip:[],demo:false}));save();render();toast('Adiado para amanhã.',{e:'⏭️'})},
calprev:()=>{cal.m--;if(cal.m<0){cal.m=11;cal.y--}render()},
calnext:()=>{cal.m++;if(cal.m>11){cal.m=0;cal.y++}render()},
caltoday:()=>{cal.sel=today();const x=new Date();cal.y=x.getFullYear();cal.m=x.getMonth();render()},
calsel:b=>{cal.sel=b.dataset.d;render()},
ics:()=>exportIcs(),
moodnow:()=>moodSheet(),
sheetmood:b=>{ST.mood.m=b.dataset.m;drawMoodGrid('msGrid',ST.mood.m,'sheetmood')},
mooddone:()=>{if(!ST.mood.m){toast('Escolha um humor.',{e:'🌡️'});return}commitMood(ST.mood.m,ST.mood.i);closeSheet();render();toast(M[ST.mood.m][TK[S.tone]],{e:MOODS[ST.mood.m].e,ms:6000})},
hmprev:()=>{const y=+hm.slice(0,4),m=+hm.slice(5)-2;const dt=new Date(y,m,1);hm=ymd(dt).slice(0,7);render()},
hmnext:()=>{const y=+hm.slice(0,4),m=+hm.slice(5);const dt=new Date(y,m,1);hm=ymd(dt).slice(0,7);render()},
dprev:()=>{dDay=addDays(dDay,-1);render()},dnext:()=>{dDay=addDays(dDay,1);render()},dtoday:()=>{dDay=today();render()},dday:b=>{dDay=b.dataset.d;render()},
dmood:b=>{const e=entryOf(dDay,true);if(!e)return;e.a.humor=b.dataset.m;saveD(mk(dDay));$$('[data-act=dmood]').forEach(x=>x.classList.toggle('on',x===b));diaryXp(dDay)},
dcolor:b=>{const e=entryOf(dDay,true);if(!e)return;e.a.corHex=b.dataset.c;e.a.cor=b.dataset.n;saveD(mk(dDay));render()},
dsum:()=>genSummary(),
claim:b=>{const id=b.dataset.id;if(S.claimed[id])return;S.claimed[id]=1;S.xp+=+b.dataset.xp;save();celebrate('Missão resgatada! +'+b.dataset.xp+' XP');render()},
redeem:b=>{const r=S.rewards.find(x=>x.id===b.dataset.id);if(!r||S.xp-S.spent<r.c)return;S.spent+=r.c;S.redeemed.push({n:r.n,d:today()});save();celebrate('Aproveite: '+r.n+'!',pick(['fogos','lobos','felizes']));render()},
delreward:b=>{S.rewards=S.rewards.filter(x=>x.id!==b.dataset.id);save();render()},
addreward:()=>{const n=$('#rw-n').value.trim(),c=Math.round(+$('#rw-c').value);if(!n||!(c>=10)){toast('Informe o nome e um custo de pelo menos 10 XP.',{e:'🎁'});return}S.rewards.push({id:uid(),n:n.slice(0,60),c:c});save();render()},
wkprev:()=>{wkOff--;render()},wknext:()=>{if(wkOff<0)wkOff++;render()},
settheme:b=>{S.theme=b.dataset.k;applyTheme();save();settings()},
settone:b=>{S.tone=b.dataset.k;save();settings()},
setpref:b=>{S.prefs[b.dataset.k]=!S.prefs[b.dataset.k];save();settings()},
regate:()=>{closeSheet();showGate()},
resetask:()=>{$('#resetbox').innerHTML='<div class="banner stack"><b>Isso apaga atividades, humor, diário e XP. Não dá para desfazer.</b><div class="row"><button class="btn sm" style="background:var(--bad);color:#fff" data-act="resetgo">Sim, apagar tudo</button><button class="btn sm" data-act="closesheet">Cancelar</button></div></div>'},
resetgo:async()=>{S=defState();S.tasks=[];D={};save();Object.keys(localStorage).filter(k=>k.indexOf('wolfa-diary-')===0).forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});closeSheet();applyTheme();render();toast('Tudo limpo. Recomeço!',{e:'🧹'})},
/* check-in */
gmood:b=>{G.mood=b.dataset.m;drawMoodGrid('gGrid',G.mood,'gmood');$('#gThermo').innerHTML=thermo(G.mood,G.i)},
gtone:b=>{G.tone=b.dataset.k;drawGate()},
gnext:()=>{
  if(G.step===1){if(!G.mood){toast('Escolha como você está.',{e:'🌡️'});return}commitMood(G.mood,G.i);G.step=2;drawGate()}
  else if(G.step===2){S.tone=G.tone;save();G.q=pendingCheckins().slice(0,15);G.idx=0;G.step=3;drawGate()}
},
gyes:()=>flyOut('yes'),gno:()=>flyOut('no'),
greason:b=>{G.reason=b.dataset.k;const v=($('#gwhy')||{}).value;drawGate();if(v)$('#gwhy').value=v},
gmiss:()=>commitMissed(false),gpost:()=>commitMissed(true),gback:()=>{G.sub='';drawGate()},gfinish:()=>finishGate(),
/* formulário */
tfcat:b=>{TF.cat=b.dataset.k;$('#sheet .sheet').innerHTML=head()+tfHtml()},
tfnotime:()=>{TF.noTime=!TF.noTime;redraw()},
tfdur:b=>{TF.dur=+b.dataset.v;redraw()},
tfrep:b=>{TF.rep=b.dataset.k;if(TF.rep==='custom'&&!TF.days.length)TF.days=[parse(TF.start).getDay()];redraw()},
tfday:b=>{const v=+b.dataset.v,i=TF.days.indexOf(v);if(i>=0)TF.days.splice(i,1);else TF.days.push(v);redraw()},
tfsave:()=>tfSave(),
tfdelask:()=>{TF.confirm=true;redraw()},tfcancel:()=>{TF.confirm=false;redraw()},
tfdel1:()=>{const t=S.tasks.find(x=>x.id===TF.id);if(t){t.skip=(t.skip||[]).concat([TF.date])}save();closeSheet();render()},
tfdelall:()=>{S.tasks=S.tasks.filter(x=>x.id!==TF.id);save();closeSheet();render();toast('Atividade excluída.',{e:'🗑️'})}
};
const head=()=>'<div class="row sp"><h2>'+(TF.id?'Editar atividade':'Nova atividade')+'</h2><button class="btn sm" data-act="closesheet" aria-label="Fechar">✕</button></div>';
function redraw(){const sh=$('#sheet .sheet');if(!sh||!TF)return;const y=sh.scrollTop;sh.innerHTML=head()+tfHtml();sh.scrollTop=y}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){const f=ACT[b.dataset.act];if(f){f(b,e);return}}
  if(e.target.id==='sheet')closeSheet();
});
let dT=0;
document.addEventListener('input',e=>{
  const el=e.target,id=el.id;
  if(id==='gi'){G.i=+el.value;$('#gil').textContent=G.i;$('#gThermo').innerHTML=thermo(G.mood,G.i);return}
  if(id==='msI'){ST.mood.i=+el.value;return}
  if(id==='st-name'){S.name=el.value.slice(0,30);save();return}
  if(TF){
    if(id==='tf-title')TF.title=el.value;else if(id==='tf-note')TF.note=el.value;
    else if(id==='tf-start'){TF.start=el.value||TF.start}
    else if(id==='tf-end')TF.end=el.value;
    else if(id==='tf-dur')TF.dur=+el.value||30;
    else if(id==='tf-h'){TF.time=pad(+el.value)+':'+TF.time.slice(3)}
    else if(id==='tf-m'){TF.time=TF.time.slice(0,2)+':'+pad(+el.value)}
    else if(id==='tf-lead')TF.lead=+el.value;
  }
  if(el.dataset&&el.dataset.q){const e2=entryOf(dDay,true);if(!e2)return;e2.a[el.dataset.q]=el.value;clearTimeout(dT);dT=setTimeout(()=>{saveD(mk(dDay));renderTop();diaryXp(dDay)},900);return}
  if(id==='sumtxt'){const e2=entryOf(dDay,true);if(!e2)return;e2.s=el.value;e2.ed=true;clearTimeout(dT);dT=setTimeout(()=>saveD(mk(dDay)),900)}
});
document.addEventListener('change',e=>{if(TF&&(e.target.id==='tf-lead'))TF.lead=+e.target.value});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();
  if(!$('#gate').hidden&&G&&G.step===3&&!G.sub&&G.q[G.idx]){if(e.key==='ArrowRight')flyOut('yes');if(e.key==='ArrowLeft')flyOut('no')}
});

document.addEventListener('change',e=>{const m=/^ft-([hb])$/.exec(e.target.id||'');if(!m)return;S.fonts=Object.assign({h:'',b:''},S.fonts);S.fonts[m[1]]=e.target.value;applyFonts();save()});
setInterval(()=>{const e=$('#mclk');if(e)e.textContent=new Date().toLocaleTimeString('pt-BR')},1000);
/* toque em vidro líquido */
(function(){
  const SEL='.btn,.chip,.pill.btnlike,.nav button,.fab,.tile,.mood,.cell,.tcard,.chk';let cur=null;
  document.addEventListener('pointerdown',e=>{const el=e.target.closest(SEL);if(!el)return;cur=el;el.classList.add('press')},true);
  document.addEventListener('pointercancel',()=>{if(cur){cur.classList.remove('press');cur=null}},true);
  document.addEventListener('pointerup',e=>{
    if(!cur)return;const el=cur;cur=null;el.classList.remove('press');if(!el.isConnected)return;
    const r=el.getBoundingClientRect(),g=document.createElement('span');
    g.className='gtap';g.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;border-radius:'+getComputedStyle(el).borderRadius+';--gx:'+(e.clientX-r.left)+'px;--gy:'+(e.clientY-r.top)+'px';
    document.body.appendChild(g);setTimeout(()=>g.remove(),1000);
    el.classList.add('jelly');setTimeout(()=>el.classList.remove('jelly'),850);
  },true);
})();
/* ---------- partida ---------- */
(async function boot(){
  fxInit();applyTheme();
  await initStore();await loadCore();if(!S.met){S.met=1;S.theme='aco';save()}applyTheme();
  const d=today(),ws=wkStart(d);
  await Promise.all([loadDiary(mk(d)),loadDiary(mk(ws)),loadDiary(mk(addDays(ws,6)))]);
  curDay=d;setSync(DB?'cloud':'local');
  if(S.lastGate!==d)showGate();
  render();watchRemote();setInterval(tick,20000);
})();
})();
</script>
